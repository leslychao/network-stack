name: Network stack

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Validate workflow and shell
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 90 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            -o "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"
          bash -n scripts/bootstrap-host.sh
          shellcheck scripts/bootstrap-host.sh
      - name: Contract and rollback tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Real container integration
        # Private bind mounts belong to the container's root user on Linux.
        run: sudo python3 tests/integration.py

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    concurrency:
      group: network-stack-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Bootstrap and deploy over SSH
        env:
          DEPLOY_ENV: ${{ secrets.DEPLOY_ENV }}
        run: python3 scripts/deliver.py
