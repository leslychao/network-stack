name: network-stack

# The only owner of initial, non-secret VPN defaults. Read by the bootstrapper.
x-bootstrap:
  admin-username: operator
  panel-url: http://127.0.0.1:2053
  panel-port: 2053
  panel-base-path: /
  inbound:
    remark: initial-vless
    port: 443
    listen: 0.0.0.0
    protocol: vless
    enable: true
    expiryTime: 0
    total: 0
    settings:
      decryption: none
      encryption: none
    streamSettings:
      # 3x-ui uses tcp for its TCP (Raw) transport and Vision share links.
      network: tcp
      security: reality
      realitySettings:
        show: false
        target: www.microsoft.com:443
        serverNames: [www.microsoft.com]
        xver: 0
        settings:
          fingerprint: chrome
          serverName: www.microsoft.com
          spiderX: /
    sniffing:
      enabled: false
  client:
    email: personal
    flow: xtls-rprx-vision
    enable: true
    limitIp: 0
    totalGB: 0
    expiryTime: 0
    reset: 0

x-service: &service
  restart: unless-stopped
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  pids_limit: 256
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

# Rendered into a private file because Compose inline configs ignore uid/mode.
x-mtg-config: |
  secret = "${MTG_SECRET:?MTG_SECRET is required}"
  bind-to = "0.0.0.0:3128"
  concurrency = 512

services:
  xui:
    <<: *service
    image: ghcr.io/mhsanaei/3x-ui:v3.8.0@sha256:ccc19475e8b783710ee2df7b5fd19569e084947ba3a34f0ad4790d45cbfdd4df
    entrypoint: [/bin/sh, -c, "umask 077; exec /app/DockerEntrypoint.sh"]
    cap_add: [NET_BIND_SERVICE]
    mem_limit: 512m
    environment:
      TZ: UTC
      XUI_DB_TYPE: sqlite
      XUI_DB_FOLDER: /etc/x-ui
      XUI_ENABLE_FAIL2BAN: "false"
      XUI_PORT: "2053"
      XUI_LOG_LEVEL: warning
      XUI_LOG_FOLDER: /var/log/x-ui
    ports:
      - "443:443"
      - "127.0.0.1:2053:2053"
    volumes:
      - ${STACK_STATE_DIR:-./state}/xui:/etc/x-ui
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /var/log/x-ui:size=32m,mode=0755
    healthcheck:
      test: [CMD, curl, --silent, --fail, --max-time, "3", --output, /dev/null, "http://127.0.0.1:2053/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  mtg:
    <<: *service
    image: nineseconds/mtg:2.2.8@sha256:c082586a19886e4822f92aa8c1949a771df3519053d64b1b5505a9a280a3929d
    user: "65532:65532"
    read_only: true
    mem_limit: 128m
    ports: ["8443:3128"]
    configs:
      - source: mtg
        target: /config.toml
    command: [run, /config.toml]

  caddy:
    <<: *service
    image: caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    cap_add: [NET_BIND_SERVICE]
    mem_limit: 128m
    ports: ["80:80", "9443:9443"]
    volumes:
      - ${STACK_STATE_DIR:-./state}/caddy-data:/data
      - ${STACK_STATE_DIR:-./state}/caddy-config:/config
    configs:
      - source: caddy
        target: /etc/caddy/Caddyfile
    depends_on:
      xui:
        condition: service_healthy

configs:
  mtg:
    file: ${STACK_RUNTIME_DIR:-./.runtime}/mtg.toml
  caddy:
    content: |
      {
        default_sni ${PANEL_HOST:?PANEL_HOST is required}
        auto_https disable_redirects
        servers {
          protocols h1 h2
        }
      }
      https://${PANEL_HOST}:9443 {
        tls {
          issuer acme {
            dir https://acme-v02.api.letsencrypt.org/directory
            profile shortlived
            disable_tlsalpn_challenge
          }
        }
        reverse_proxy xui:2053
      }
      http://${PANEL_HOST}:80 {
        redir https://${PANEL_HOST}:9443{uri} 308
      }
